<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>港口生产数字化大屏</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 顶部标题栏 -->
  <header class="top-bar">
    <div class="top-bar__left">
      <span class="top-bar__date" id="currentDate">2026-11-13 星期五</span>
      <span class="top-bar__clock" id="currentClock">09:26:00</span>
    </div>
    <h1 class="top-bar__title">港口生产数字化管控平台</h1>
    <div class="top-bar__right">
      <span class="status-dot status-dot--online"></span>
      <span class="top-bar__status">系统运行中</span>
    </div>
  </header>

  <!-- 主体三栏布局 -->
  <main class="layout">
    <!-- 左侧面板 -->
    <aside class="panel panel--left">
      <div class="kpi-grid">
        <div class="kpi-card" data-key="throughput">
          <div class="kpi-card__label">今日吞吐量</div>
          <div class="kpi-card__value" data-counter data-suffix=" TEU">0</div>
          <div class="kpi-card__trend kpi-card__trend--up">▲ 3.2%</div>
        </div>
        <div class="kpi-card" data-key="efficiency">
          <div class="kpi-card__label">作业效率</div>
          <div class="kpi-card__value" data-counter data-suffix=" move/h">0</div>
          <div class="kpi-card__trend kpi-card__trend--up">▲ 1.8%</div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-card__title">近 12 小时吞吐趋势</div>
        <canvas id="chartThroughput" width="320" height="160"></canvas>
      </div>

      <div class="chart-card">
        <div class="chart-card__title">各泊位作业效率</div>
        <canvas id="chartBerthEff" width="320" height="180"></canvas>
      </div>

      <div class="chart-card chart-card--list">
        <div class="chart-card__title">船舶在港动态</div>
        <ul class="ship-list" id="shipList"></ul>
      </div>
    </aside>

    <!-- 中央三维场景 -->
    <section class="scene-wrap">
      <div id="scene-container"></div>
      <div class="scene-overlay scene-overlay--bl">堆场利用率 <span data-key="yardRate" data-counter data-suffix="%">0</span></div>
      <div class="scene-overlay scene-overlay--br">岸桥作业 <span data-key="craneActive" data-counter data-suffix=" 台">0</span></div>
      <div class="scene-tag">3D 实时场景 · DOF 景深渲染</div>
    </section>

    <!-- 右侧面板 -->
    <aside class="panel panel--right">
      <div class="kpi-grid">
        <div class="kpi-card" data-key="shipsInPort">
          <div class="kpi-card__label">船舶在港</div>
          <div class="kpi-card__value" data-counter data-suffix=" 艘">0</div>
          <div class="kpi-card__trend kpi-card__trend--down">▼ 0</div>
        </div>
        <div class="kpi-card" data-key="yardRate">
          <div class="kpi-card__label">堆场利用率</div>
          <div class="kpi-card__value" data-counter data-suffix="%">0</div>
          <div class="kpi-card__trend kpi-card__trend--up">▲ 2.1%</div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-card__title">堆场分区利用率</div>
        <canvas id="chartYardZone" width="320" height="180"></canvas>
      </div>

      <div class="chart-card">
        <div class="chart-card__title">货物类型占比</div>
        <canvas id="chartCargoType" width="320" height="180"></canvas>
      </div>

      <div class="chart-card chart-card--list">
        <div class="chart-card__title">告警事件</div>
        <ul class="alert-list" id="alertList"></ul>
      </div>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
